services:
  - type: web
    name: mergero-model-api
    runtime: docker
    plan: free
    dockerfilePath: ./data-analysis/Dockerfile
    dockerContext: ./data-analysis
    healthCheckPath: /api/health
    envVars:
      - key: MODEL_TYPE
        value: logistic
      - key: REQUIRE_API_TOKEN
        value: "true"
      - key: MODEL_API_TOKEN
        generateValue: true
  - type: web
    name: mergero-sourcing-api
    runtime: docker
    plan: free
    dockerfilePath: ./sourcing-engine/Dockerfile
    dockerContext: ./sourcing-engine
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: ALLOW_PAID_RESEARCH
        value: "true"
      - key: MARKET_CANDIDATE_LIMIT
        value: "5"
      - key: ENABLE_WEB_SEARCH
        value: "true"
      - key: REQUIRE_API_TOKEN
        value: "true"
      - key: SOURCING_API_TOKEN
        generateValue: true
      - key: STORAGE_DIR
        value: /app/storage
      - key: REGION_CACHE_HOURS
        value: "168"
      - key: COMPANY_CACHE_HOURS
        value: "24"
      - key: MODEL_API_URL
        sync: false
      - key: MODEL_API_TOKEN
        fromService:
          type: web
          name: mergero-model-api
          envVarKey: MODEL_API_TOKEN
